# Local development only - not for production.
#
# Full FluxGate Development Environment
# Includes: MongoDB, Redis (standalone), ELK Stack
#
# Every port is published on 127.0.0.1 only, so this unauthenticated Redis, this
# security-disabled Elasticsearch and these throwaway MongoDB credentials stay unreachable
# from the surrounding network. Redis authentication stays off on purpose: the samples and
# the integration tests default to redis://localhost:6379 with no credentials.
#
# Usage:
#   docker compose -f docker/full.yml up -d
#   docker compose -f docker/full.yml down
#
# Services (all bound to 127.0.0.1):
#   - MongoDB:       127.0.0.1:27017 (user: fluxgate, password: fluxgate123 - throwaway)
#   - Redis:         127.0.0.1:6379 (no auth)
#   - Elasticsearch: 127.0.0.1:9200
#   - Kibana:        127.0.0.1:5601
#   - Logstash:      127.0.0.1:5044 (TCP input), 127.0.0.1:9600 (monitoring)
version: "3.8"

services:
  # ============================================
  # MongoDB - Rule Storage
  # ============================================
  mongo:
    image: mongo:7.0
    container_name: fluxgate-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fluxgate
      MONGO_INITDB_ROOT_PASSWORD: fluxgate123
      MONGO_INITDB_DATABASE: fluxgate
    volumes:
      - mongo-data:/data/db

  # ============================================
  # Redis Standalone - Rate Limiting
  # ============================================
  redis:
    image: redis:7.2-alpine
    container_name: fluxgate-redis
    ports:
      - "127.0.0.1:6379:6379"

  # ============================================
  # ELK Stack - Logging & Monitoring
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elk-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: elk-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: elk-logstash
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5044:5044"   # TCP input
      - "127.0.0.1:9600:9600"   # Logstash monitoring API
    environment:
      - XPACK_MONITORING_ENABLED=false
      - PIPELINE_WORKERS=1
    command: >
      logstash -e '
        input {
          tcp {
            port => 5044
            codec => json_lines
          }
        }
        output {
          elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "fluxgate-logs-%{+YYYY.MM.dd}"
          }
        }
      '

volumes:
  mongo-data:
  es-data:
