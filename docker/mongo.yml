# Local development only - not for production.
#
# Ports are published on 127.0.0.1 so nothing on the surrounding network can reach this
# MongoDB. The credentials below are the throwaway values the samples default to; never
# reuse them anywhere real.
version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: fluxgate-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fluxgate
      MONGO_INITDB_ROOT_PASSWORD: fluxgate123
      MONGO_INITDB_DATABASE: fluxgate
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
