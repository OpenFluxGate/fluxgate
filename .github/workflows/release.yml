name: Release to Maven Central

on:
  push:
    # Version-shaped release branches only (release/X.Y.Z or release/X.Y.Z-qualifier), so a branch
    # such as release/0.4-hardening never starts a deployment. GitHub filter patterns are globs:
    # '+' repeats the preceding character class and '.' is literal. The step below still validates
    # the exact version.
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'
      - 'release/[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    # Needed only to create the GitHub Release and upload its assets.
    permissions:
      contents: write

    services:
      mongo:
        image: mongo:7.0.14
        env:
          MONGO_INITDB_ROOT_USERNAME: fluxgate
          MONGO_INITDB_ROOT_PASSWORD: "ci-test-only-fluxgate"
          MONGO_INITDB_DATABASE: fluxgate
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --username fluxgate --password 'ci-test-only-fluxgate' --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        env:
          IP: "0.0.0.0"
          INITIAL_PORT: 7100
        ports:
          - 7100:7100
          - 7101:7101
          - 7102:7102
          - 7103:7103
          - 7104:7104
          - 7105:7105
        options: >-
          --health-cmd "redis-cli -p 7100 cluster info | grep cluster_state:ok"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    env:
      FLUXGATE_MONGO_URI: "mongodb://fluxgate:ci-test-only-fluxgate@localhost:27017/fluxgate?authSource=admin"
      FLUXGATE_MONGO_DB: "fluxgate"
      FLUXGATE_REDIS_URI: "redis://localhost:6379"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper jar checksum
        # wrapperSha256Sum in maven-wrapper.properties is not used: mvnw validates it with
        # `sha256sum -c`, which is the BSD variant on macOS and rejects a correct hash there. The
        # jar is fetched and pinned here (Linux runner) before mvnw can execute it.
        run: |
          mkdir -p .mvn/wrapper
          curl -fsSL -o .mvn/wrapper/maven-wrapper.jar \
            https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.2.0/maven-wrapper-3.2.0.jar
          echo "e63a53cfb9c4d291ebe3c2b0edacb7622bbc480326beaa5a0456e412f52f066a  .mvn/wrapper/maven-wrapper.jar" | shasum -a 256 -c -

      - name: Resolve version from the branch and verify the tag
        id: version
        run: |
          # release/0.4.0 -> 0.4.0 (RELEASING.md). The version is never guessed from the tags: a
          # Maven Central deployment cannot be deleted, so it has to be exactly what was tagged.
          VERSION="${GITHUB_REF_NAME#release/}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Branch '$GITHUB_REF_NAME' does not name a release version (expected release/X.Y.Z)"
            exit 1
          fi
          TAG="v$VERSION"
          if ! TAG_COMMIT=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            echo "::error::Tag $TAG does not exist. Push the branch and the tag together (see RELEASING.md)."
            exit 1
          fi
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Tag $TAG points at $TAG_COMMIT but the branch HEAD is $HEAD_COMMIT"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $HEAD_COMMIT (tag $TAG)"

      - name: Set version
        # Passed through the environment and quoted rather than interpolated into the script: the
        # branch name is repository content, and ${{ }} interpolation would run whatever it contains.
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./mvnw -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Build and test (unit + integration + Redis Cluster)
        # The redis-cluster service above backs the cluster integration tests.
        # fluxgate.redis.cluster.require=true makes them fail, not skip, when the cluster is unreachable.
        run: ./mvnw -B verify -Predis-cluster-it -Dfluxgate.redis.cluster.require=true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # maven-gpg-plugin 3.2.x reads the passphrase from this variable
          # (passphraseEnvName defaults to MAVEN_GPG_PASSPHRASE), so it never becomes a
          # process argument visible to `ps` or to other build plugins.
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B deploy -Prelease -DskipTests \
            -s .github/settings.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            fluxgate-core/target/*.jar
            fluxgate-redis-ratelimiter/target/*.jar
            fluxgate-mongo-adapter/target/*.jar
            fluxgate-spring-boot2-starter/target/*.jar
            fluxgate-spring-boot3-starter/target/*.jar
            fluxgate-control-support/target/*.jar

      - name: Upload SBOM to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: target/bom.json
