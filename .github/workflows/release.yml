name: Release to Maven Central

on:
  push:
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    services:
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: fluxgate
          MONGO_INITDB_ROOT_PASSWORD: "ci-test-only-fluxgate"
          MONGO_INITDB_DATABASE: fluxgate
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --username fluxgate --password 'ci-test-only-fluxgate' --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        env:
          IP: "0.0.0.0"
          INITIAL_PORT: 7100
        ports:
          - 7100:7100
          - 7101:7101
          - 7102:7102
          - 7103:7103
          - 7104:7104
          - 7105:7105
        options: >-
          --health-cmd "redis-cli -p 7100 cluster info | grep cluster_state:ok"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    env:
      FLUXGATE_MONGO_URI: "mongodb://fluxgate:ci-test-only-fluxgate@localhost:27017/fluxgate?authSource=admin"
      FLUXGATE_MONGO_DB: "fluxgate"
      FLUXGATE_REDIS_URI: "redis://localhost:6379"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Get version from latest tag
        id: version
        run: |
          # Get latest tag (e.g., v0.1.1 or 0.1.1 -> 0.1.1)
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set version
        # Passed through the environment and quoted rather than interpolated into the script: a tag
        # name is repository content, and ${{ }} interpolation would run whatever it contains.
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./mvnw -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Build and test (unit + integration)
        run: ./mvnw -B verify

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # maven-gpg-plugin 3.2.x reads the passphrase from this variable
          # (passphraseEnvName defaults to MAVEN_GPG_PASSPHRASE), so it never becomes a
          # process argument visible to `ps` or to other build plugins.
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B deploy -Prelease -DskipTests \
            -s .github/settings.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            fluxgate-core/target/*.jar
            fluxgate-redis-ratelimiter/target/*.jar
            fluxgate-mongo-adapter/target/*.jar
            fluxgate-spring-boot2-starter/target/*.jar
            fluxgate-spring-boot3-starter/target/*.jar
