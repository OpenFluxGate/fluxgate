name: OpenSSF Scorecard

on:
  # Run weekly and on pushes to the default branch.
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [ "main" ]

# Least-privilege: read-only on most resources; id-token + security-events are
# needed for Scorecard's OIDC publish and SARIF upload respectively.
permissions:
  contents: read
  actions: read
  id-token: write
  security-events: write

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF public dashboard (read-only OIDC token).
          publish_results: true

      - name: Upload SARIF results to code-scanning
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: results.sarif
