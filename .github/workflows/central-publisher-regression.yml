name: Central publisher regression
on:
  pull_request:
    paths: ['pom.xml', '.github/scripts/test-central-publisher.py', '.github/tests/central-publisher/**', '.github/workflows/central-publisher-regression.yml']
  push:
    branches: [main, feature/lts-0.5.0]
    paths: ['pom.xml', '.github/scripts/test-central-publisher.py', '.github/tests/central-publisher/**', '.github/workflows/central-publisher-regression.yml']
permissions:
  contents: read
jobs:
  no-upload-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Test status parser and credential-free synthetic bundle
        run: python3 .github/scripts/test-central-publisher.py
