name: Redis-only 0.3.8 release

on:
  push:
    branches: ['development/0.3.8-scan']
    tags: ['v0.3.8']

permissions:
  contents: read

concurrency:
  group: redis-038-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'OpenFluxGate/fluxgate' && (github.ref == 'refs/heads/development/0.3.8-scan' || github.ref == 'refs/tags/v0.3.8')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        env:
          IP: "0.0.0.0"
          INITIAL_PORT: 7100
        ports:
          - 7100:7100
          - 7101:7101
          - 7102:7102
          - 7103:7103
          - 7104:7104
          - 7105:7105
        options: >-
          --health-cmd "redis-cli -p 7100 cluster info | grep cluster_state:ok"
          --health-interval=10s --health-timeout=10s --health-retries=10
    env:
      FLUXGATE_REDIS_URI: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check reviewed commit and isolated release scope
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify-redis-038-release.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify module against public parent and core 0.3.7
        run: |
          mvn -B -ntp -f fluxgate-redis-ratelimiter/pom.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/redis-038-m2" \
            -Prelease -Dgpg.skip=true clean verify
          python3 scripts/verify-redis-038-release.py --artifacts --reports
      - name: Prepare unsigned review bundle (not a Central deployment)
        run: |
          mkdir redis-038-review
          cp fluxgate-redis-ratelimiter/target/fluxgate-redis-ratelimiter-0.3.8*.jar redis-038-review/
          cp fluxgate-redis-ratelimiter/pom.xml redis-038-review/fluxgate-redis-ratelimiter-0.3.8.pom
          git rev-parse HEAD > redis-038-review/SOURCE_COMMIT
          (cd redis-038-review && sha256sum *.jar *.pom > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redis-0.3.8-unsigned-java${{ matrix.java }}-${{ github.sha }}
          path: redis-038-review/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: prepare
    if: github.event_name == 'push' && github.repository == 'OpenFluxGate/fluxgate' && github.ref == 'refs/tags/v0.3.8'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        env:
          IP: "0.0.0.0"
          INITIAL_PORT: 7100
        ports:
          - 7100:7100
          - 7101:7101
          - 7102:7102
          - 7103:7103
          - 7104:7104
          - 7105:7105
        options: >-
          --health-cmd "redis-cli -p 7100 cluster info | grep cluster_state:ok"
          --health-interval=10s --health-timeout=10s --health-retries=10
    env:
      FLUXGATE_REDIS_URI: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact approved source before accessing release credentials
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify-redis-038-release.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Require an unpublished coordinate
        run: python3 scripts/check-redis-038-central.py
      - name: Import approved signing key without logging key data
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/redis-038-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build and verify signed artifacts before upload
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGNING_FINGERPRINT: 15B43B5AFC7552E0B1AE9AE5AA145AD232EC597B
        run: |
          set -euo pipefail
          [[ "$SIGNING_FINGERPRINT" =~ ^[0-9A-Fa-f]{40}$ ]]
          mvn -B -ntp -f fluxgate-redis-ratelimiter/pom.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/redis-038-m2" \
            -Prelease -Dgpg.keyname="$SIGNING_FINGERPRINT" clean verify
          python3 scripts/verify-redis-038-release.py --artifacts --reports
          python3 scripts/verify-redis-038-signatures.py
      - name: Publish only Redis 0.3.8 (Central autoPublish is enabled)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGNING_FINGERPRINT: 15B43B5AFC7552E0B1AE9AE5AA145AD232EC597B
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          python3 scripts/verify-redis-038-release.py --artifacts --reports
          python3 scripts/verify-redis-038-signatures.py
          mvn -B -ntp -f fluxgate-redis-ratelimiter/pom.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/redis-038-m2" \
            -Prelease -Dgpg.keyname="$SIGNING_FINGERPRINT" \
            -s .github/settings.xml deploy
      - name: Verify published coordinate matches this build
        run: python3 scripts/check-redis-038-central.py --published
      - name: Remove temporary signing material
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/redis-038-gnupg" --kill all >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/redis-038-gnupg"
