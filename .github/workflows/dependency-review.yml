name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

# Least-privilege: read-only, plus pull-requests: write for the summary comment. Pull requests from
# forks get a read-only token, so the comment is skipped there while the check itself still runs.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail on high and critical vulnerabilities with known fixes.
          fail-on-severity: high
          # Post a summary comment on the PR only when the check fails (keeps green PRs quiet).
          comment-summary-in-pr: on-failure
