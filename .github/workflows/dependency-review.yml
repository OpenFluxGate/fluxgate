name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  advisory-scope:
    name: Enforce scoped advisory policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_ghsas: ${{ steps.gate.outputs.approved_ghsas }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify advisory policy regressions
        run: python3 -m unittest discover -s .github/scripts -p test_dependency_advisories.py

      - name: Enforce advisory policy on the full dependency diff
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_dependency_advisories.py

  dependency-review:
    name: Review dependency changes
    needs: advisory-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The pinned Marketplace action reports licenses, Scorecard, and failing PRs.
    # This job neither checks out nor executes PR code.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Marketplace accepts IDs only. The required job also requires the independent
          # full comparison to approve every occurrence by exact dependency and expiry.
          allow-ghsas: ${{ needs.advisory-scope.outputs.approved_ghsas != 'none' && needs.advisory-scope.outputs.approved_ghsas || '' }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: on-failure

      - name: Require scoped advisory policy
        if: ${{ !cancelled() && (needs.advisory-scope.result != 'success' || needs.advisory-scope.outputs.approved_ghsas == '') }}
        run: |
          echo "Scoped dependency advisory policy failed. See the Enforce scoped advisory policy job."
          exit 1
