name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

# Least-privilege: read-only, plus pull-requests: write for the summary comment. Pull requests from
# forks get a read-only token, so the comment is skipped there while the check itself still runs.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency Review
        id: review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # The next step checks this advisory against the same unfiltered comparison.
          allow-ghsas: GHSA-4wrc-f8pq-fpqp
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # Post a summary comment on the PR only when the check fails (keeps green PRs quiet).
          comment-summary-in-pr: on-failure

      - name: Enforce Boot 2 advisory scope
        # Empty comparisons emit []. Missing output must fail closed.
        if: ${{ success() && (steps.review.outputs.dependency-changes == '' || contains(steps.review.outputs.dependency-changes, 'GHSA-4wrc-f8pq-fpqp')) }}
        env:
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
        run: printf '%s' "$DEPENDENCY_CHANGES" | python3 .github/scripts/check_boot2_advisory.py
