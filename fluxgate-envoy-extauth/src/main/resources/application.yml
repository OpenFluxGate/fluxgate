server:
  port: 8080
spring:
  application:
    name: fluxgate-envoy-extauth
fluxgate:
  reload:
    enabled: false
  envoy:
    rule-set-id: ${FLUXGATE_RULE_SET_ID:default-limits}
  mongo:
    enabled: true
    uri: ${FLUXGATE_MONGO_URI:mongodb://localhost:27017/fluxgate}
    database: ${FLUXGATE_MONGO_DB:fluxgate}
    rule-collection: rate_limit_rules
    event-collection: rate_limit_events
  redis:
    enabled: true
    uri: ${FLUXGATE_REDIS_URI:redis://localhost:6379}
  ratelimit:
    mode: REDIS
    missing-rule-behavior: DENY
    missing-key-behavior: REJECT
    failure-behavior: DENY
    filter-enabled: false
    fallback:
      mode: NONE
